version: "3"

vars:
  ENV_MODE:
    sh: |
      if [ -n "${ENV_MODE}" ]; then
        echo "${ENV_MODE}"
      elif [ -n "${APP_ENV}" ]; then
        echo "${APP_ENV}"
      else
        echo "dev"
      fi
  COMPOSE_FILE:
    sh: |
      case "${ENV_MODE:-${APP_ENV:-dev}}" in
        prod|production)
          echo "docker-compose.prod.yml"
          ;;
        *)
          echo "docker-compose.yml"
          ;;
      esac
  COMPOSE_ENV_FILE: ".env"
  COMPOSE_BIN:
    sh: |
      if docker compose version >/dev/null 2>&1; then
        echo "docker compose"
      elif command -v docker-compose >/dev/null 2>&1; then
        echo "docker-compose"
      else
        echo "ERROR: neither 'docker compose' nor 'docker-compose' is available in PATH" >&2
        exit 1
      fi
  COMPOSE_ENV_FILE_FLAG:
    sh: |
      if docker compose version >/dev/null 2>&1; then
        echo "--env-file {{.COMPOSE_ENV_FILE}}"
      elif docker-compose --help 2>/dev/null | grep -q -- '--env-file'; then
        echo "--env-file {{.COMPOSE_ENV_FILE}}"
      fi
  COMPOSE_CMD: "{{.COMPOSE_BIN}} -f {{.COMPOSE_FILE}} {{.COMPOSE_ENV_FILE_FLAG}}"
  EXEC_FLAGS:
    sh: |
      if [ -t 0 ] && [ -t 1 ]; then
        echo ""
      else
        echo "-T"
      fi

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  env:
    desc: Show detected environment mode and compose file
    cmds:
      - echo "ENV_MODE={{.ENV_MODE}} COMPOSE_FILE={{.COMPOSE_FILE}} COMPOSE_ENV_FILE={{.COMPOSE_ENV_FILE}}"
      - echo "COMPOSE_CMD={{.COMPOSE_CMD}}"

  dev:
    desc: Start the local development stack
    cmds:
      - task: up
        vars: { ENV_MODE: "dev" }

  dev:restart:
    desc: Rebuild and recreate the local development stack
    cmds:
      - task: restart
        vars: { ENV_MODE: "dev" }

  dev:logs:
    desc: Follow local development logs
    cmds:
      - task: logs
        vars: { ENV_MODE: "dev" }

  backend:
    desc: Open a shell in the backend container
    cmds:
      - "{{.COMPOSE_CMD}} exec {{.EXEC_FLAGS}} backend sh"

  frontend:
    desc: Open a shell in the frontend container
    cmds:
      - "{{.COMPOSE_CMD}} exec {{.EXEC_FLAGS}} frontend sh"

  nginx:
    desc: Open a shell in the nginx container
    cmds:
      - "{{.COMPOSE_CMD}} exec {{.EXEC_FLAGS}} nginx sh"

  db:
    desc: Open a shell in the postgres container
    cmds:
      - "{{.COMPOSE_CMD}} exec {{.EXEC_FLAGS}} postgres sh"

  cmd:
    desc: Run a command in a service, e.g. task cmd SERVICE=backend -- npm run test:unit
    requires:
      vars:
        - SERVICE
    cmds:
      - "{{.COMPOSE_CMD}} exec {{.EXEC_FLAGS}} {{.SERVICE}} {{.CLI_ARGS}}"

  backend:cmd:
    desc: Run a backend command, e.g. task backend:cmd -- npm run test:unit
    cmds:
      - "{{.COMPOSE_CMD}} exec {{.EXEC_FLAGS}} backend {{.CLI_ARGS}}"

  frontend:cmd:
    desc: Run a frontend command, e.g. task frontend:cmd -- npm run test:unit
    cmds:
      - "{{.COMPOSE_CMD}} exec {{.EXEC_FLAGS}} frontend {{.CLI_ARGS}}"

  migrate:
    desc: Run backend database migrations for the active compose environment
    cmds:
      - "{{.COMPOSE_CMD}} run --rm migrate"

  pull:
    desc: Pull latest upstream images referenced by active compose
    cmds:
      - "{{.COMPOSE_CMD}} pull"

  build:
    desc: Rebuild active environment services without cache
    cmds:
      - "{{.COMPOSE_CMD}} build --pull --no-cache --force-rm"

  up:
    desc: Start active environment services in detached mode
    cmds:
      - "{{.COMPOSE_CMD}} up -d --remove-orphans"

  down:
    desc: Stop active environment services
    cmds:
      - "{{.COMPOSE_CMD}} down --remove-orphans"

  restart:
    desc: Rebuild and recreate active environment services
    cmds:
      - "{{.COMPOSE_CMD}} up -d --build --force-recreate --remove-orphans"
      - task: ps
        vars: { ENV_MODE: "{{.ENV_MODE}}" }

  logs:
    desc: Follow active environment service logs
    cmds:
      - "{{.COMPOSE_CMD}} logs -f --tail=200"

  ps:
    desc: Show active environment service status
    cmds:
      - "{{.COMPOSE_CMD}} ps"

  config:
    desc: Validate rendered active environment compose config
    cmds:
      - "{{.COMPOSE_CMD}} config"

  deploy:
    desc: CI/CD friendly deploy for active environment (pull, build, up, status)
    cmds:
      - task: pull
        vars: { ENV_MODE: "{{.ENV_MODE}}" }
      - task: build
        vars: { ENV_MODE: "{{.ENV_MODE}}" }
      - task: up
        vars: { ENV_MODE: "{{.ENV_MODE}}" }
      - task: ps
        vars: { ENV_MODE: "{{.ENV_MODE}}" }
