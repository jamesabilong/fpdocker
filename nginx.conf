events {}

http {
    client_max_body_size 6m;

    upstream frontend {
        server fresh-price-front:5173;
    }

    upstream backend {
        server platform-backend:4000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://frontend;
            # WebSocket upgrade required for Vite HMR
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-FreshPrice-Client-IP $http_x_freshprice_client_ip;
            proxy_set_header X-FreshPrice-Proxy-Key $http_x_freshprice_proxy_key;
            proxy_set_header X-FreshPrice-Internal-Key "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-FreshPrice-Client-IP $http_x_freshprice_client_ip;
            proxy_set_header X-FreshPrice-Proxy-Key $http_x_freshprice_proxy_key;
            proxy_set_header X-FreshPrice-Internal-Key "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
