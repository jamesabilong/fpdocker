worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    client_max_body_size 6m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml application/xml font/woff2;
    gzip_min_length 1024;

    server {
        listen 80;
        server_name freshprice.philwatch.com;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # This healthcheck stays healthy during intentional maintenance.
        location = /healthz {
            access_log off;
            default_type application/json;
            add_header Cache-Control "no-store" always;
            return 200 '{"status":"ok"}';
        }

        error_page 503 /maintenance.html;
        location = /maintenance.html {
            internal;
            alias /opt/freshprice-maintenance/index.html;
            add_header Retry-After "60" always;
            add_header Cache-Control "no-store" always;
        }

        location = /index.html {
            if (-f /etc/nginx/maintenance.enabled) { return 503; }
            root /usr/share/nginx/html;
            try_files $uri =503;
            add_header Cache-Control "no-store" always;
        }
        location = /api { return 308 /api/; }
        # Missing static resources must never fall through to the SPA.
        location ~* \.(?:js|css|map|json|png|jpg|jpeg|svg|ico|webp|woff2?|ttf|txt|xml|html)$ {
            root /usr/share/nginx/html;
            try_files $uri =404;
            add_header Cache-Control "no-cache";
        }

        # Cache Vite content-hashed assets indefinitely
        location ^~ /assets/ {
            root /usr/share/nginx/html;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # Serve static files
        location / {
            if (-f /etc/nginx/maintenance.enabled) { return 503; }
            error_page 500 502 503 504 =503 /maintenance.html;
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }

        # Proxy API requests
        location ^~ /api/ {
            error_page 502 503 504 =503 @api_unavailable;
            if (-f /etc/nginx/maintenance.enabled) { return 503; }
            resolver 127.0.0.11 valid=30s;
            resolver_timeout 3s;
            set $backend_url http://freshprice_backend:4000;
            proxy_pass $backend_url$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
        location @api_unavailable {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            add_header Retry-After "60" always;
            return 503 '{"message":"Service temporarily unavailable"}';
        }
    }

    server {
        listen 80;
        server_name philwatch.com;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location / {
            resolver 127.0.0.11 valid=30s;
            set $sugilanon_url http://sugilanon:3000;
            proxy_pass $sugilanon_url$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        location /api/ {
            resolver 127.0.0.11 valid=30s;
            set $backend_url http://freshprice_backend:4000;
            proxy_pass $backend_url$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}
