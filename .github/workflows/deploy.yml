name: Build and Deploy

on:
  repository_dispatch:
    types: [frontend-updated, backend-updated, sugilanon-updated]

concurrency:
  group: freshprice-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fpdocker
        uses: actions/checkout@v4
        with:
          path: fpdocker

      - name: Checkout frontend source
        if: github.event.action == 'frontend-updated'
        uses: actions/checkout@v4
        with:
          repository: jamesabilong/fresh-price-front
          token: ${{ secrets.GH_PAT }}
          path: fresh-price-front

      - name: Checkout backend source
        if: github.event.action == 'backend-updated'
        uses: actions/checkout@v4
        with:
          repository: jamesabilong/fresh-price-backend
          token: ${{ secrets.GH_PAT }}
          path: platform-backend

      - name: Checkout Sugilanon source
        if: github.event.action == 'sugilanon-updated'
        uses: actions/checkout@v4
        with:
          repository: jamesabilong/sugilanon
          token: ${{ secrets.GH_PAT }}
          ref: ${{ github.event.client_payload.ref || 'main' }}
          path: sugilanon

      - name: Login to GHCR
        run: echo "${{ secrets.GH_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push frontend
        if: github.event.action == 'frontend-updated'
        run: |
          docker build \
            --target frontend-prod \
            --build-arg VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }} \
            -t ghcr.io/jamesabilong/fresh-price-frontend:latest \
            -f fpdocker/Dockerfile.prod .
          docker push ghcr.io/jamesabilong/fresh-price-frontend:latest

      - name: Build and push backend
        if: github.event.action == 'backend-updated'
        run: |
          test -f platform-backend/package.json
          docker build \
            -t ghcr.io/jamesabilong/platform-backend:latest \
            -f fpdocker/Dockerfile.backend.prod platform-backend
          for attempt in 1 2 3; do
            docker push ghcr.io/jamesabilong/platform-backend:latest && break
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done

      - name: Build and push Sugilanon
        if: github.event.action == 'sugilanon-updated'
        run: |
          test -f sugilanon/package.json
          docker build \
            --build-arg NEXT_PUBLIC_API_BASE_URL=${{ secrets.SUGILANON_API_BASE_URL }} \
            --build-arg NEXT_PUBLIC_SITE_URL=${{ secrets.SUGILANON_SITE_URL }} \
            -t ghcr.io/jamesabilong/sugilanon:latest \
            -f fpdocker/Dockerfile.sugilanon.prod sugilanon
          for attempt in 1 2 3; do
            docker push ghcr.io/jamesabilong/sugilanon:latest && break
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            dump_deploy_diagnostics() {
              echo "=== Docker service status ==="
              docker service ls || true
              for service in freshprice_backend freshprice_frontend freshprice_sugilanon; do
                echo "=== docker service ps $service ==="
                docker service ps --no-trunc "$service" || true
                echo "=== docker service logs $service ==="
                docker service logs --tail 80 "$service" || true
              done
            }

            trap dump_deploy_diagnostics ERR

            cd /var/projects/freshprice/fpdocker
            git pull --ff-only origin master

            env_value() {
              awk -F= -v key="$1" '
                $0 !~ /^[[:space:]]*#/ && $1 == key {
                  sub(/^[^=]*=/, "")
                  print
                  exit
                }
              ' .env
            }

            for key in \
              DATABASE_URL POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB POSTGRES_HOST POSTGRES_PORT \
              JWT_SECRET ALLOWED_ORIGINS BACKEND_IMAGE_TAG FRONTEND_IMAGE_TAG SUGILANON_IMAGE_TAG \
              SUGILANON_API_BASE_URL SUGILANON_SITE_URL CONTENT_API_BASE_URL \
              NGINX_PORT NGINX_SSL_PORT DB_POOL_MAX DB_POOL_MIN DB_SSL
            do
              value="$(env_value "$key")"
              if [ -n "$value" ]; then
                export "$key=$value"
              fi
            done

            # Pull only the image that changed
            if [ "${{ github.event.action }}" == "frontend-updated" ]; then
              docker pull ghcr.io/jamesabilong/fresh-price-frontend:latest
              docker stack deploy -c docker-compose.prod.yml freshprice
              docker service update \
                --force \
                --update-order stop-first \
                --image ghcr.io/jamesabilong/fresh-price-frontend:latest \
                freshprice_frontend
            fi

            if [ "${{ github.event.action }}" == "backend-updated" ]; then
              docker pull ghcr.io/jamesabilong/platform-backend:latest
              if ! docker service inspect freshprice_backend >/dev/null 2>&1; then
                docker stack deploy -c docker-compose.prod.yml freshprice
              fi
              docker network update --attachable freshprice_node-network
              docker run --rm \
                --env-file .env \
                --network freshprice_node-network \
                -e NODE_ENV=production \
                -e UPLOAD_DIR=/app/uploads \
                ghcr.io/jamesabilong/platform-backend:latest \
                npx sequelize-cli db:migrate
              docker service update \
                --force \
                --update-order stop-first \
                --image ghcr.io/jamesabilong/platform-backend:latest \
                freshprice_backend
            fi

            if [ "${{ github.event.action }}" == "sugilanon-updated" ]; then
              docker pull ghcr.io/jamesabilong/sugilanon:latest
              docker stack deploy -c docker-compose.prod.yml freshprice
              docker service update --detach=true --force --image ghcr.io/jamesabilong/sugilanon:latest freshprice_sugilanon
            fi

            docker image prune -f
