events {}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8443 ssl;
        server_name _;
        client_max_body_size 6m;

        ssl_certificate /etc/nginx/certs/freshprice-lan.pem;
        ssl_certificate_key /etc/nginx/certs/freshprice-lan-key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:FreshPriceLAN:10m;
        ssl_session_timeout 10m;
        add_header Strict-Transport-Security "max-age=0" always;

        location /api/ {
            set $freshprice_backend backend:4000;
            proxy_pass http://$freshprice_backend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Origin http://localhost:5173;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_hide_header Strict-Transport-Security;
        }

        location / {
            set $freshprice_frontend frontend:5173;
            proxy_pass http://$freshprice_frontend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host localhost;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 1h;
        }
    }
}
