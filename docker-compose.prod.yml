services:
  backend:
    image: ghcr.io/jamesabilong/platform-backend:${BACKEND_IMAGE_TAG:-latest}
    env_file:
    - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NODE_ENV=production
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - UPLOAD_DIR=/app/uploads
      - DB_POOL_MAX=${DB_POOL_MAX:-20}
      - DB_POOL_MIN=${DB_POOL_MIN:-2}
      - DB_SSL=${DB_SSL:-false}
    volumes:
      - /var/projects/freshprice/logs/backend:/app/logs
      - uploads-data:/app/uploads
    networks:
      - node-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      replicas: 1
      update_config:
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/platform/db/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: ["node", "src/server.js"]

  postgres:
    image: postgres:14
    env_file:
      - .env
    networks:
      - node-network
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-logs:/var/log/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -h localhost -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  frontend:
    image: ghcr.io/jamesabilong/fresh-price-frontend:${FRONTEND_IMAGE_TAG:-latest}
    ports:
      - target: 80
        published: ${NGINX_PORT:-8081}
        protocol: tcp
        mode: host
    networks:
      - node-network
    environment:
      - NODE_ENV=production
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      replicas: 1
      update_config:
        order: stop-first
        failure_action: rollback
      restart_policy:
        condition: on-failure 
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  sugilanon:
    image: ghcr.io/jamesabilong/sugilanon:${SUGILANON_IMAGE_TAG:-latest}
    env_file:
      - .env
    networks:
      - node-network
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - CONTENT_API_BASE_URL=${CONTENT_API_BASE_URL:-http://backend:4000/api}
      - NEXT_PUBLIC_API_BASE_URL=${SUGILANON_API_BASE_URL:-https://philwatch.com/api}
      - NEXT_PUBLIC_SITE_URL=${SUGILANON_SITE_URL:-https://philwatch.com}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      replicas: 1
      update_config:
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  node-network:
    driver: overlay
    attachable: true

volumes:
  postgres-data:
  postgres-logs:
  uploads-data:
